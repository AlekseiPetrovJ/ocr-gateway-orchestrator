version: '3.8'

include:
  - path: docker-compose.langfuse.yml
    env_file: .env
# ==============================================================================
# ВНИМАНИЕ: ЭТОТ КОНФИГ langfuse ВЫСТРАДАН КРОВЬЮ И 4 ДНЯМИ ОТЛАДКИ.
# 1. НЕ УДАЛЯЙ ПУСТЫЕ ПЕРЕМЕННЫЕ (например, EMAIL_FROM_ADDRESS: "", вообще никакие не удаляй) — Langfuse
#    может упасть при их отсутствии в окружении.
# 2. ПОРЯДОК depends_on И healthcheck КРИТИЧЕН — сервисы v3 очень капризны.
# 3. ВСЕ ИЗМЕНЕНИЯ ПАРОЛЕЙ ДЕЛАТЬ ТОЛЬКО В .env ФАЙЛЕ.
# 4. ПРИ СМЕНЕ ПАРОЛЕЙ БАЗ ОБЯЗАТЕЛЬНО: docker compose down -v
# ==============================================================================


networks:
  ocr-network:
    name: ocr-network
    driver: bridge

services:
  db:
    image: ankane/pgvector:latest
    container_name: ocr_gateway_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ocr_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ocr_gateway"]
      interval: 5s
      timeout: 5s
    networks:
      - ocr-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ocr_gateway_mq
    hostname: rabbitmq-node
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-node
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks:
      - ocr-network

  redis:
    image: redis:7-alpine
    container_name: ocr_gateway_redis
    networks:
      - ocr-network

  minio:
    image: minio/minio
    container_name: ocr-minio
    ports:
      - "9005:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
    volumes:
      - minio_data:/data
    networks:
      - ocr-network

volumes:
  pgdata:
  rabbitdata:
  langfuse_pgdata:
  minio_data:
  clickhouse_data:
